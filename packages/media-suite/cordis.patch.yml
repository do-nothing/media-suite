# media-suite is the distribution shell: installing it must mount the provider
# rows too, because its providers arrive as plain npm dependencies and
# dependencies are NOT added to dsh.profile.bundles by `dsh plugin add`. Only
# bundle patches of packages listed in dsh.profile.bundles are applied, so the
# providers' own patches would never run. The suite therefore inserts all three
# rows itself.
#
# The suite has no config: where files land is a per-call choice, not a profile
# setting.
- insert:
    - id: media-suite
      name: '@tmmk/media-suite'
    - id: media-qwen
      name: '@tmmk/media-qwen'
    - id: media-runninghub
      name: '@tmmk/media-runninghub'
      config:
        surface: jobs
        channel: lowprice
        concurrency: 2
        pollIntervalSeconds: 30
